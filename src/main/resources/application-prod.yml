# Production Overrides
app:
  cors:
    allowed-origins: ${APP_CORS_ALLOWED_ORIGINS} # Must be set in production

spring:
  jpa:
    properties:
      hibernate:
        "[format_sql]": false

  data:
    redis:
      ssl:
        enabled: ${REDIS_SSL_ENABLED:true} # Default to true for production if using managed Redis

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false

# Logging
logging:
  pattern:
    level: "%d{yyyy-MM-dd HH:mm:ss.SSS} %5p ${PID:- } --- [%t] %-40.40logger{39} : [%X{correlationId}] %m%n${LOG_EXCEPTION_CONVERSION_WORD:-%wEx}"