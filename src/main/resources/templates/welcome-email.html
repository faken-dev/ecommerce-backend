<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 40px auto; background: #fff;
                     border-radius: 8px; padding: 40px; }
        .btn { display: inline-block; background: #ee4d2d; color: #fff;
               padding: 12px 32px; border-radius: 4px; text-decoration: none;
               margin-top: 24px; }
        .footer { font-size: 12px; color: #999; text-align: center; margin-top: 32px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Welcome, <span th:text="${fullName}">Friend</span>!</h2>
    <p>Your account has been created successfully.</p>
    <p>Start shopping now and discover great deals every day.</p>

    <a href="#" class="btn">Start Shopping</a>

    <div class="footer">© 2026 ECommerce. Do not reply to this email.</div>
</div>
</body>
</html>
