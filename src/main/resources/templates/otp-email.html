<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <style>
        body { font-family: Arial, sans-serif; background: #f4f4f4; margin: 0; padding: 0; }
        .container { max-width: 480px; margin: 40px auto; background: #fff;
                     border-radius: 8px; padding: 40px; }
        .code { font-size: 36px; font-weight: bold; letter-spacing: 8px;
                color: #ee4d2d; text-align: center; margin: 32px 0; }
        .footer { font-size: 12px; color: #999; text-align: center; margin-top: 32px; }
    </style>
</head>
<body>
<div class="container">
    <h2>Verification Code</h2>
    <p>Use the code below to complete your <strong th:text="${purpose}">verification</strong>.</p>

    <div class="code" th:text="${code}">000000</div>

    <p>This code expires in <strong th:text="${minutes}">5</strong> minutes.</p>
    <p>If you did not request this, please ignore this email.</p>

    <div class="footer">© 2026 ECommerce. Do not reply to this email.</div>
</div>
</body>
</html>
