spring:
  application:
    name: ecommerce-backend

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}

  config:
    import: "optional:file:.env[.properties]"

  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:ecommerce_db}
    username: ${POSTGRES_USER:postgres}
    password: ${POSTGRES_PASSWORD:2610}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: EcommerceHikariPool
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1800000


  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:null}
      timeout: 2000ms
      lettuce:
        pool:
          max-active: 8
          max-idle: 8
          min-idle: 2
          max-wait: -1ms

  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        "[format_sql]": false
        "[jdbc.batch_size]": 20
        "[order_inserts]": true
        "[order_updates]": true
    open-in-view: false 

  flyway:
    enabled: true
    locations: classpath:db/migration

  # OAuth2 Client (Google, Apple, etc.)
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope: openid, email, profile
            redirect-uri: ${GOOGLE_REDIRECT_URI:{baseUrl}/login/oauth2/code/google}
        provider:
          google:
            user-name-attribute: email


# Custom Properties
app:
  # JWT
  jwt:
    secret: ${JWT_SECRET}
    access-expiration-ms: ${JWT_ACCESS_EXPIRATION_MS:900000}    # 15 phút
    refresh-expiration-ms: ${JWT_REFRESH_EXPIRATION_MS:604800000} # 7 ngày

  # OTP
  otp:
    expiry-minutes: ${OTP_EXPIRY_MINUTES:5}
    length: ${OTP_LENGTH:6}
    max-attempts: ${OTP_MAX_ATTEMPTS:3}
    hmac-secret: ${OTP_HMAC_SECRET}   # REQUIRED — no default. Must be set via environment variable.

  # Rate limiting
  rate-limit:
    # Comma-separated trusted proxy IPs (e.g. Nginx, Cloudflare).
    # Leave empty if not behind a reverse proxy.
    trusted-proxies: ${RATE_LIMIT_TRUSTED_PROXIES:}

  # Admin bootstrap
  bootstrap:
    admin-enabled: ${ADMIN_BOOTSTRAP_ENABLED:false}
    admin-email: ${ADMIN_BOOTSTRAP_EMAIL:}
    admin-password: ${ADMIN_BOOTSTRAP_PASSWORD:}

  # Allow configuring CORS allowed origins via environment variable (comma-separated)
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# Notification Services
notification:
  sendgrid:
    api-key: ${SENDGRID_API_KEY}
    from-email: ${SENDGRID_FROM_EMAIL}
    from-name: ${SENDGRID_FROM_NAME}
  twilio:
    account-sid: ${TWILIO_ACCOUNT_SID}
    auth-token: ${TWILIO_AUTH_TOKEN}
    from-phone: ${TWILIO_FROM_PHONE:0232343433}
    whatsapp-from: ${TWILIO_WHATSAPP_FROM}

# OpenAPI (Swagger)
springdoc:
  api-docs:
    path: /api-docs
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: alpha
    tags-sorter: alpha
  show-actuator: true

# Monitoring & Security
management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

